# Continuous integration: lint, unit tests and database integration tests.
# The LLM evaluation suite is NOT run here: it needs a GPU-backed 7B model,
# which free GitHub runners do not have. It is run locally (scripts/run_eval.py)
# and its exit code is the local quality gate.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read   # least privilege: this workflow only reads the repository

jobs:
  test:
    runs-on: ubuntu-latest

    # A real PostgreSQL with pgvector, so the permission-filter SQL is tested for real.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bankdoc
          POSTGRES_PASSWORD: ci_only_password   # throwaway: the database lives only for this job
          POSTGRES_DB: bankdoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bankdoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bankdoc:ci_only_password@localhost:5432/bankdoc
      RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # CPU-only wheel: the default one bundles CUDA libraries and is several GB larger.
      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Create database schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=ci_only_password psql -h localhost -U bankdoc -d bankdoc -f db/init.sql

      - name: Test (unit + database integration)
        run: pytest -q
